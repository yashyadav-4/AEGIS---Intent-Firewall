apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.kapt"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream ->
        localProps.load(stream)
    }
}

def dotEnv = new Properties()
def dotEnvFile = rootProject.file('../.env')
if (dotEnvFile.exists()) {
    dotEnvFile.eachLine('UTF-8') { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#')) return
        def splitIndex = trimmed.indexOf('=')
        if (splitIndex <= 0) return

        def key = trimmed.substring(0, splitIndex).trim()
        def value = trimmed.substring(splitIndex + 1).trim()
        if ((value.startsWith('"') && value.endsWith('"') && value.length() >= 2) ||
            (value.startsWith("'") && value.endsWith("'") && value.length() >= 2)) {
            value = value.substring(1, value.length() - 1)
        }
        dotEnv.setProperty(key, value)
    }
}

def readSecret = { String key ->
    return dotEnv.getProperty(key, localProps.getProperty(key, System.getenv(key) ?: ''))
}

def geminiKeysFromEnv = (1..5)
    .collect { idx -> readSecret("AP${idx}")?.trim() }
    .findAll { it }

def geminiApiKeysRaw = geminiKeysFromEnv
    ? geminiKeysFromEnv.join(',')
    : readSecret('GEMINI_API_KEYS')

if (!geminiApiKeysRaw) {
    geminiApiKeysRaw = readSecret('GEMINI_API_KEY')
}

def geminiApiKeyRaw = geminiKeysFromEnv
    ? geminiKeysFromEnv[0]
    : readSecret('GEMINI_API_KEY')

def geminiApiKeyEscaped = geminiApiKeyRaw.replace('\\', '\\\\').replace('"', '\\"')
def geminiApiKeysEscaped = geminiApiKeysRaw.replace('\\', '\\\\').replace('"', '\\"')
def geminiModelRaw = readSecret('GEMINI_MODEL') ?: 'gemma-4-31b'
def geminiModelEscaped = geminiModelRaw.replace('\\', '\\\\').replace('"', '\\"')
def geminiVoiceModelRaw = readSecret('GEMINI_VOICE_MODEL') ?: 'gemini-2.0-flash'
def geminiVoiceModelEscaped = geminiVoiceModelRaw.replace('\\', '\\\\').replace('"', '\\"')

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.intentfirewall"
    defaultConfig {
        applicationId "com.intentfirewall"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "2.0"
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKeyEscaped}\""
        buildConfigField "String", "GEMINI_API_KEYS", "\"${geminiApiKeysEscaped}\""
        buildConfigField "String", "GEMINI_MODEL", "\"${geminiModelEscaped}\""
        buildConfigField "String", "GEMINI_VOICE_MODEL", "\"${geminiVoiceModelEscaped}\""
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "intent-firewall-v5.apk"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('intentfirewall.keystore')
            storePassword 'firewall123'
            keyAlias 'intentfirewall'
            keyPassword 'firewall123'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Aegis-Zero: TFLite deepfake audio detection
    implementation('org.tensorflow:tensorflow-lite:2.14.0') {
        exclude group: 'com.google.flatbuffers'
    }
    implementation('org.tensorflow:tensorflow-lite-gpu:2.14.0') {
        exclude group: 'com.google.flatbuffers'
    }
    // Tier 2 — ONNX Runtime for DistilBERT inference
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    kapt 'androidx.room:room-compiler:2.7.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.12'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
